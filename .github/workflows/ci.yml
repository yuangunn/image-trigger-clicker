name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff (린트)
        run: ruff check .

      - name: mypy (타입 검사)
        run: mypy

      # 테스트는 화면에 접근하지 않는다. pyautogui 는 지연 임포트라
      # 화면 서버가 없는 러너에서도 임포트만으로 죽지 않는다.
      - name: pytest (단위 테스트)
        run: pytest
