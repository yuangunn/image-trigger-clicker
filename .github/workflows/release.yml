name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: sdist / wheel 빌드
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: 빌드 결과 확인
        run: ls -lh dist

      - name: GitHub Release 생성 및 아티팩트 첨부
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      # 서명·공증은 하지 않는다. itc 는 .app 번들이 아니라 Homebrew 로 설치되는
      # CLI 실행 파일이라 Gatekeeper 격리 검사 대상이 아니다. (README 참고)
