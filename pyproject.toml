[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "image-trigger-clicker"
version = "0.1.0"
description = "Trigger clicks on preset coordinates when a given image appears on screen"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "yuangunn" }]
keywords = ["automation", "gui", "cli", "macos", "accessibility", "screen-matching"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Utilities",
]
dependencies = [
    "pyautogui>=0.9.54",
    "opencv-python>=4.8",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
itc = "image_trigger_clicker.cli:main"

[project.urls]
Homepage = "https://github.com/yuangunn/image-trigger-clicker"
Issues = "https://github.com/yuangunn/image-trigger-clicker/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/image_trigger_clicker"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001~003: 한국어 주석/문자열의 전각 문장부호를 "헷갈리는 문자"로 잡는다. 의도한 것이다.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = false
no_implicit_optional = true

# 서드파티는 타입 검사 대상이 아니라 따라 들어가지 않는다.
# pytest 를 넣은 이유: pytest -> numpy 로 이어지는데, numpy 2.5 스텁은 python_version
# 3.11 로는 파싱조차 안 된다(type 구문). 우리 코드와는 무관한 실패라 체인을 끊는다.
[[tool.mypy.overrides]]
module = [
    "pyautogui", "pyautogui.*",
    "pyscreeze", "pyscreeze.*",
    "PIL", "PIL.*",
    "cv2", "cv2.*",
    "numpy", "numpy.*",
    "pytest", "pytest.*", "_pytest.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
